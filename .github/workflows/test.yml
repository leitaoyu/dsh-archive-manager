name: 兼容性回归

on:
  # 只按分支推送触发：写成空的 `push:` 会把 tag 推送也算进来，于是同一个 commit
  # 既在分支上又在标签上时会重复跑两遍完整回归。tag 的验证由 publish.yml 负责，
  # 它发布前已经执行过同一条 `pnpm verify`。
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 安装依赖
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          corepack enable
          pnpm install --frozen-lockfile --config.minimumReleaseAge=1440 --registry=https://registry.npmjs.org

      - name: 执行完整验证
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          pnpm verify
